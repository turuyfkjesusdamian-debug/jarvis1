org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official

# Signing config for jarvis-release.keystore. Not treated as a real secret:
# this is a single-user, sideloaded personal app (never published, never
# auto-updated) — see JARVIS/SECURITY.md § Access control. The keystore
# only exists so every build is signed the same way and Android lets a new
# APK install over the old one instead of requiring an uninstall first.
JARVIS_KEYSTORE_PASSWORD=jarvis-personal-app-2026
JARVIS_KEY_ALIAS=jarvis
JARVIS_KEY_PASSWORD=jarvis-personal-app-2026
