name: Build JARVIS Android app

# This project's own sandbox can't reach Google's Android SDK servers, so
# the APK is built here instead — see JARVIS/ARCHITECTURE.md § Decisions
# ("the Android companion app"). Every push that touches android/ produces
# a freshly signed APK as a downloadable workflow artifact.
on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Build signed release APK
        run: ./gradlew assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-app
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
